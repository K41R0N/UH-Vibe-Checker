[build]
  # Install dependencies, then TypeScript, then build
  command = """
    npm ci --prefer-offline --no-audit --progress=false &&
    npm install typescript @types/react @types/node --no-save &&
    npm run build
  """
  publish = ".next"

[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_VERSION = "18.17.0"
  NPM_VERSION = "9.6.7"
  NODE_ENV = "production"
  CI = "true"
  # Force TypeScript to be available
  NETLIFY_USE_YARN = "false"
  YARN_ENABLE_GLOBAL = "false"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.processing]
  skip_processing = true

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.images]
  compress = true

[functions]
  node_bundler = "esbuild"
  included_files = [
    "src/data/cities.json",
    "src/types/**/*.ts"
  ]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 3000

# Important Notes:
# 1. Environment variables (API keys, etc.) should be set in the Netlify dashboard
# 2. Required environment variables:
#    - NEXT_PUBLIC_OPENWEATHER_API_KEY
# 3. Future API integrations:
#    - Huggingface API (planned)
#    - Database connections (planned)
#    - Additional weather providers (planned) 