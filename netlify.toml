[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_VERSION = "18"
  NPM_VERSION = "9"

[[plugins]]
  package = "@netlify/plugin-nextjs"
  [plugins.inputs]
    skipBuildVersionCheck = true
    useNewRuntime = true

# Specify runtime settings
[functions]
  node_bundler = "esbuild"
  included_files = ["src/data/cities.json"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 3000

# Note: Environment variables should be set in the Netlify dashboard
# Do not add API keys or sensitive data here 