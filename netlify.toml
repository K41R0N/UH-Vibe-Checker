[build]
  command = "npm install --save-dev typescript@5.3.3 && npm run build"
  publish = ".next"

[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_VERSION = "18.17.0"
  NPM_VERSION = "9.6.7"
  NODE_ENV = "production"
  NEXT_PUBLIC_OPENWEATHER_API_KEY = "placeholder"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.processing]
  skip_processing = true

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.images]
  compress = true

[functions]
  node_bundler = "esbuild"
  included_files = [
    "src/data/cities.json",
    "src/types/**/*.ts"
  ]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 3000

# Note: Environment variables should be set in the Netlify dashboard
# Do not add API keys or sensitive data here 